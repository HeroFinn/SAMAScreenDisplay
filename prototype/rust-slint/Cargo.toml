[package]
name = "sama-display-slint"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.8", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
slint-build = "1.8"

